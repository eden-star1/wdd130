<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | SPLASH WHITE WATER RAFTING</title>
    <meta name="description"
      content="Contact page for wwr adventure employee profiles,contact infomation etc.">
    <meta name="author" content="Eden Nanseta">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="grid-header">
        <img src="images/z-splash.png" alt="Splash White Water Rafting logo" class="logo">

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>contact us</h1>


        <h2>send us a message</h2>
        <p>White Water Rafting</p>
        <p>Phone: 999-999-9999</p>
        <p><a href="mailto:info@splash.com">info@splash.com</a></p>

        <div class="map-form">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d845416.6838702111!2d-118.93394465324404!3d34.13587888185932!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c280a5bffa65c5%3A0x8f03c1443c734740!2sSix%20Flags%20Magic%20Mountain!5e0!3m2!1sen!2smw!4v1775320429566!5m2!1sen!2smw"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <fieldset>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required><br>

                    <label for="useremail">Email :</label>
                    <input type="email" id="useremail" name="useremail" required>
                </fieldset>

                <fieldset>
                    <legend>Message purpose</legend>

                    <input type="radio" id="general" name="purpose" value="general">
                    <label for="general">General inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="website" name="purpose" value="website">
                    <label for="website">Website Suggestion</label>
                </fieldset>

                <fieldset>
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>
                </fieldset>

                <fieldset>
                    <label for="subscribe">Please subscribe me to the monthly
                        newsletter</label>
                    <input type="checkbox" name="subscribe" id="subscribe">
                </fieldset>
                <button type="submit">Get in touch</button>
            </form>
        </div>

        <section class="employees">
            <h3>We Are Here to Serve You</h3>
            <div class="employee-gallery">
                <figure>
                    <img src="images/adam.jpg" alt="Friendly employee">
                    <figcaption>employee profile</figcaption>
                </figure>

                <figure>
                    <img src="images/nicole.jpg" alt="Friendly employee">
                    <figcaption>employee profile</figcaption>
                </figure>

                <figure>
                    <img src="images/niki.jpg" alt="Friendly employee">
                    <figcaption>employee profile</figcaption>
                </figure>
            </div>
        </section>
    </main>


    <footer class="color">
        <p>© 2026 SPLASH WHITE WATER RAFTING - Eden Nanseta</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="Youtube Icon">
            </a>
        </nav>
    </footer>
</body>


</html>
